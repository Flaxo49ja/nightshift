[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.1.0"
description = "A single-machine SOC practice range: collect host telemetry, detect, triage, score."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Anayo Chibuike Anyafulu" }]
dependencies = []

[project.scripts]
nightshift = "nightshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
